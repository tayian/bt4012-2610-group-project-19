# Code style for the whole repo: `python run.py format` rewrites files, `python run.py lint` only checks.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]
extend-exclude = ["data/stubs"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Pyflakes (unused or undefined names), pycodestyle errors and warnings, and import order.
select = ["F", "E", "W", "I"]
# Long prose strings (code book text, messages) are allowed; the formatter wraps the code itself.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The code book template uses two trailing spaces as Markdown line breaks.
"src/llm/corpus/build_codebook.py" = ["W291"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
